<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#0369a1,#38bdf8);min-height:100vh;margin:0;padding:30px;color:white;box-sizing:border-box}
main{max-width:500px;margin:40px auto;background:rgba(255,255,255,.15);padding:30px;border-radius:20px;text-align:center}
input{width:90%;padding:14px;border:0;border-radius:8px;margin-bottom:15px}
button{padding:13px 25px;background:#0c4a6e;color:white;border:0;border-radius:8px;cursor:pointer}
#weather{margin-top:25px;line-height:1.8}
</style>
</head>
<body>
<main>
<h1>Weather Dashboard</h1>
<p>Explore current weather conditions.</p>
<input id="city" placeholder="Enter city name">
<button onclick="getWeather()">Search Weather</button>
<div id="weather"></div>
</main>
<script>
async function getWeather(){
 const city=document.getElementById("city").value.trim();
 const output=document.getElementById("weather");
 if(!city){
  output.textContent="Please enter a city.";
  return;
 }
 output.textContent="Loading weather...";
 try{
  const geo=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(city)+"&count=1");
  const data=await geo.json();
  if(!data.results?.length){
   output.textContent="City not found.";
   return;
  }
  const place=data.results[0];
  const response=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+place.latitude+"&longitude="+place.longitude+"&current=temperature_2m,relative_humidity_2m,wind_speed_10m");
  const weather=await response.json();
  const w=weather.current;
  output.replaceChildren();
  const heading=document.createElement("h2");
  heading.textContent=place.name+", "+place.country;
  output.appendChild(heading);
  ["Temperature: "+w.temperature_2m+" °C",
   "Humidity: "+w.relative_humidity_2m+"%",
   "Wind Speed: "+w.wind_speed_10m+" km/h"
  ].forEach(text=>{
   const p=document.createElement("p");
   p.textContent=text;
   output.appendChild(p);
  });
 }catch{
  output.textContent="Unable to load weather data.";
 }
}
</script>
</body>
</html>
